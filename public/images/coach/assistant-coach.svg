<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="750" fill="url(#grad)" />
  <rect width="600" height="750" fill="url(#grid)" />

  <!-- Martial Arts Silhouette Graphic -->
  <g transform="translate(200, 255) scale(1.1)" opacity="0.2" fill="#ffffff">
    <circle cx="90" cy="15" r="14" />
    <path d="M70 35 L110 35 L125 70 L105 75 L95 50 L95 90 L135 100 L130 115 L85 100 L70 140 L50 135 L65 85 L60 50 L40 65 L30 55 Z" />
    <path d="M95 50 L140 25 L180 -5 L190 10 L150 35 L105 75 Z" />
  </g>

  <!-- Red Accent Stripe -->
  <rect x="0" y="738" width="600" height="12" fill="#dc2626" />

  <!-- Badge / Tag -->
  <rect x="210" y="310" width="180" height="32" rx="16" fill="#dc2626" fill-opacity="0.9" />
  <text x="300" y="331" font-family="'Montserrat', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    SENIOR COACH
  </text>

  <!-- Title -->
  <text x="300" y="380" font-family="'Montserrat', sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">
    Senior Instructor
  </text>

  <!-- Subtitle -->
  <text x="300" y="413" font-family="'Inter', sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">
    4th Dan Kukkiwon Certified Coach
  </text>

  <!-- Helper Note -->
  <rect x="120" y="695" width="360" height="28" rx="6" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.15)" />
  <text x="300" y="713" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
    [📷 Replace with your photo in public/images/]
  </text>
</svg>